name: CI

on:
  pull_request:
  push:
    branches: [main, refraction]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Structural checks only — rendering requires macOS + Icon Composer
      # and happens on a maintainer machine at release time.
      - run: node pipeline/validate.mjs
      - run: pnpm --filter @podlink/icons build
      - run: pnpm --filter @podlink/icons test
      - run: pnpm --filter web build
