<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Plate: the store raster's per-row gradient (ledger 2026-09-17 refit). Mark: two half-discs measured from the shipped 1024 master (2026-09-18/19): outer arcs are circles centred at (550.5,471.9) and (471.6,551.0) px, radius 239.8 / 239.4 px at the raster's 50% edge crossing (circle fits rms 0.35 on the G>110 boundary, 240.8 / 240.4, minus the 1 px to the half-level); seam along (-1,1)/sqrt2 through both centres; sharp tips, as the developer draws them. Lobe gradients are per-row means of the master over each lobe's eroded interior. -->
  <defs><linearGradient id="snipd-plate" x1="16" x2="16" y1="0" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#1D2366"/><stop offset="0.1304" stop-color="#1C2264"/><stop offset="0.9438" stop-color="#040728"/><stop offset="1" stop-color="#040728"/></linearGradient><linearGradient id="snipd-top" x1="0" x2="0" y1="7.4063" y2="19.5938" gradientUnits="userSpaceOnUse"><stop stop-color="rgb(123,255,216)"/><stop offset="1" stop-color="rgb(0,227,158)"/></linearGradient><linearGradient id="snipd-bottom" x1="0" x2="0" y1="12.3750" y2="24.5000" gradientUnits="userSpaceOnUse"><stop stop-color="rgb(10,218,154)"/><stop offset="1" stop-color="rgb(0,163,112)"/></linearGradient></defs>
