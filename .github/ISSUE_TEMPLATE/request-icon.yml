name: Request an icon
description: Ask for a podcast app's icon to be added (maintainers will extract it).
title: "[request] "
labels: ["icon-request"]
body:
  - type: markdown
    attributes:
      value: |
        Can't produce a `.icon` bundle yourself? That's the normal case —
        extraction needs macOS, the installed app, and tooling. Tell us which
        app and we'll take it from there. (If you're the app's developer,
        please use the *Submit an icon* template instead — it's faster.)
  - type: input
    id: app
    attributes:
      label: App name
    validations:
      required: true
  - type: input
    id: store
    attributes:
      label: App Store link
      placeholder: https://apps.apple.com/...
    validations:
      required: true
  - type: dropdown
    id: liquid
    attributes:
      label: Does the app ship a Liquid Glass (layered) icon on iOS 26 / macOS 26?
      options:
        - "Yes"
        - "No / not sure"
    validations:
      required: true
