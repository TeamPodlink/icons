name: Deploy

# Deploys the directory site to Cloudflare (icons.podlink.com).
# Secrets (maintainer, GitHub repo settings):
#   CLOUDFLARE_API_TOKEN    Workers deploy token
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare account id
#   OP3_TOKEN               optional OP3 API token for the popularity
#                           snapshot (unset -> OP3's public preview token)
# The build points Liquid Glass images at the immutable R2 release prefix
# for the version in packages/refraction/package.json (uploaded with
# pnpm release:assets).

on:
  push:
    branches: [refraction]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Refresh the OP3 popularity snapshot at deploy time only (never at
      # request time). An OP3 outage must not fail the deploy: on error the
      # script leaves apps/web/lib/op3-popularity.json untouched and the
      # site ships the committed baseline. OP3_TOKEN falls back to OP3's
      # public preview token when the secret is unset.
      - name: Fetch OP3 popularity
        run: node pipeline/fetch-popularity.mjs
        continue-on-error: true
        env:
          OP3_TOKEN: ${{ secrets.OP3_TOKEN }}

      - run: node pipeline/validate.mjs

      - run: pnpm --filter @podlink/icons build

      - name: Read release version
        id: release
        run: echo "version=$(node -p "require('./packages/refraction/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build site
        run: pnpm --filter web build
        env:
          VITE_ASSET_BASE: https://assets.icons.podlink.com/${{ steps.release.outputs.version }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy
