<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Netflix 18.49.0 ships a Liquid Glass stack (Assets.car IconImageStack "AppIcon", decanted 2026-09-19): three SVG layers over an automatic-gradient display-p3 0.043 canvas — top-layer (the diagonal, fill srgb .898,.035,.078), Shadow Mid Layer 4 (the diagonal's shadow gradient), bottom-layer (the stems, fill srgb .698,.027,.063). This flat is those layers at the bundle's placement (220×400 natural, scale 1.76432 / 1.78568, translation −1 / −0.5 pt) over the plate as ictool paints the canvas (per-row fit of the master). No translucency or shadow in the stack; what the glass adds is specular only. -->
